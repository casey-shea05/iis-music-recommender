    <figcaption>Green traces the interaction loop: a reason becomes an adjustment, scoring penalises tracks that clash with it, and the queue planner swaps them out of Up next. The taste profile is inferred offline from listening history and stays fixed; reasons re-weight scores on top of it. The fake engine is a simulated stand-in for Spotify, and the Claude Haiku interpreter for typed reasons is planned but not built.</figcaption>
